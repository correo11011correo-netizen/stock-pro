<!-- SALES VIEW -->
<div id="view-sales" class="view">
    <h2 data-i18n="menu_sales">Terminal de Ventas</h2>
    <div class="grid">
        <div class="card">
            <h3>🛒 Carrito</h3>
            <div id="cart-items" style="min-height: 200px; margin-bottom: 20px;"></div>
            <div style="font-size: 1.5rem; font-weight: 800; text-align: right; margin-bottom: 20px;">
                Total: <span id="cart-total">$0.00</span>
            </div>
            <button class="btn btn-primary" style="width: 100%" onclick="app.openCheckout()">💰 <span data-i18n="btn_pay">Cobrar Venta</span></button>
        </div>
        <div class="card">
            <h3>🔍 Búsqueda Rápida</h3>
            <div class="form-group" style="position: relative;">
                <input type="text" id="sale-scan" class="input" placeholder="Escanea código o escribe nombre..." oninput="app.handleSaleSearchInput()">
                <!-- 🆕 DROPDOWN DE AUTOCOMPLETADO -->
                <div id="quick-results" class="search-results-dropdown"></div>
            </div>
        </div>
    </div>
</div>
