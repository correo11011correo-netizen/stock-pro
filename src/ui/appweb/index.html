<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Pro - App Híbrida</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <link rel="apple-touch-icon" href="img/icon-192.png">
</head>
<body>
    <div id="app">
        <!-- Notification Container -->
        <div id="toast-container" class="toast-container"></div>

        <!-- Pantalla de Login (Online Obligatorio) -->
        <div id="screen-login" class="screen">
            <div class="login-box">
                <h1>Stock Pro</h1>
                <p class="subtitle">Inicia sesión para sincronizar datos</p>
                <input type="text" id="login-user" placeholder="Usuario">
                <input type="password" id="login-pass" placeholder="Contraseña">
                <button onclick="app.handleLogin()" id="btn-login">Entrar</button>
                <p id="login-error" class="error"></p>
                <p style="margin-top: 1rem; font-size: 0.8rem; color: #94a3b8;">¿No tienes cuenta? <a href="#" onclick="app.handleRegister()" style="color: #6366f1; text-decoration: none; font-weight: bold;">Regístrate aquí</a></p>
            </div>
        </div>

        <!-- Pantalla Principal -->
        <div id="screen-main" class="screen hidden">
            <header>
                <div class="user-info">
                    <span id="user-name-display">Usuario</span>
                    <span id="user-role-badge" class="badge">Rol</span>
                </div>
                <div id="sync-status" class="status-online">Online</div>
                <div style="display:flex; gap:10px; align-items:center;">
                    <button onclick="app.toggleConsole()" class="btn-console" style="background:none; border:1px solid #334155; color:white; padding:5px 10px; border-radius:5px; cursor:pointer;">💻 Console</button>
                    <button onclick="app.logout()" class="btn-logout" style="background:none; border:1px solid #334155; color:white; padding:5px 10px; border-radius:5px; cursor:pointer;">Salir</button>
                </div>
            </header>

            <nav class="tab-container">
                <button class="tab-btn active" onclick="app.showTab('stock')">📦 Stock</button>
                <button class="tab-btn" onclick="app.showTab('ventas')">💰 Ventas</button>
                <button class="tab-btn hidden" id="btn-admin-tab" onclick="app.showTab('admin')">⚙️ Admin</button>
                <button class="tab-btn" onclick="app.syncNow()">🔄 Sync</button>
            </nav>

            <main id="main-content">
                <!-- Tab Stock -->
                <div id="tab-stock" class="tab-content">
                    <div class="search-bar">
                        <input type="text" id="stock-search" placeholder="Buscar producto..." oninput="app.searchStock()">
                        <button onclick="app.searchStock()">🔍</button>
                    </div>
                    <div id="stock-list" class="list"></div>
                </div>

                <!-- Tab Ventas -->
                <div id="tab-ventas" class="tab-content hidden">

                    <!-- Buscador con autocompletado -->
                    <div class="ventas-search-section">
                        <div class="search-bar" style="position:relative;">
                            <input
                                type="text"
                                id="ventas-search"
                                placeholder="Buscar por código o nombre..."
                                oninput="app.onVentasSearchInput()"
                                autocomplete="off"
                            >
                            <button onclick="app.searchVentas()">🔍</button>
                            <div id="ventas-autocomplete" class="autocomplete-dropdown hidden"></div>
                        </div>
                    </div>

                    <!-- Productos más vendidos -->
                    <div id="bestsellers-section" class="bestsellers-section">
                        <h4 class="section-title">🔥 Más Vendidos</h4>
                        <div id="bestsellers-list" class="list"></div>
                    </div>

                    <!-- Resultados de búsqueda -->
                    <div id="ventas-results-section" class="hidden">
                        <h4 class="section-title">📋 Resultados</h4>
                        <div id="ventas-stock-list" class="list"></div>
                    </div>

                    <!-- Carrito -->
                    <div class="cart-section">
                        <h4 class="section-title">🛒 Carrito</h4>
                        <div id="cart-list" class="list cart-list-inner"></div>
                        <div class="cart-summary">
                            <div class="cart-total-row">
                                <span class="total-label">Total</span>
                                <span class="total-amount">$<strong id="cart-total">0.00</strong></span>
                            </div>
                            <button class="btn-finalizar" onclick="app.processSale()">✅ Finalizar Venta</button>
                        </div>
                    </div>

                </div>

                <!-- Tab Admin (Carga Dinámica/Online) -->
                <div id="tab-admin" class="tab-content hidden">
                    <div class="admin-panel">
                        <h3>Panel Administrativo</h3>
                        <p>Este módulo requiere conexión activa al servidor.</p>
                        <div class="admin-grid">
                            <button onclick="app.adminAction('inventario')">📦<span>Inventario</span></button>
                            <button onclick="app.adminAction('reportes')">📈<span>Reportes</span></button>
                            <button onclick="app.adminAction('usuarios')">👥<span>Usuarios</span></button>
                            <button onclick="app.adminAction('config')">⚙️<span>Config</span></button>
                        </div>
                    </div>
                </div>
            </main>
        </div>

        <!-- System Console Drawer -->
        <div id="sys-console" class="sys-console hidden">
            <div class="console-header">
                <span>System Console</span>
                <button onclick="app.toggleConsole()">✕</button>
            </div>
            <div id="console-logs" class="console-logs"></div>
            <div class="console-input-area">
                <span>></span>
                <input type="text" id="console-cmd" placeholder="Escribe un comando..." onkeydown="if(event.key === 'Enter') app.executeConsoleCmd()">
            </div>
        </div>
    </div>

    <script src="js/db-local.js"></script>
    <script src="js/sync-engine.js"></script>
    <script src="js/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrado:', reg.scope))
                    .catch(err => console.log('Error registrando SW:', err));
            });
        }
    </script>
</body>
</html>
    </div>

    <script src="js/db-local.js"></script>
    <script src="js/sync-engine.js"></script>
    <script src="js/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrado:', reg.scope))
                    .catch(err => console.log('Error registrando SW:', err));
            });
        }
    </script>
</body>
</html>
